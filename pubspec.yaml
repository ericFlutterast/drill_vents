name: drill_events
description: "City events in cool places into your town"

publish_to: 'none'

version: 1.0.2+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  logger: ^2.5.0
  flutter_bloc: ^9.0.0
  drift: ^2.25.1
  intl: ^0.20.2
  bloc_concurrency: ^0.3.0
  google_fonts: ^6.2.1
  build_runner: ^2.4.15
  equatable: ^2.0.7
  reactive_forms: ^17.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  json_serializable: ^6.9.4
  json_annotation: ^4.9.0
  dio: ^5.8.0+1
  flutter_gen: ^5.9.0
  flutter_gen_runner: ^5.9.0
  shared_preferences: ^2.5.2
  flutter_secure_storage: ^9.2.4
  flutter_animate: ^4.5.2
  firebase_core: ^3.12.1
  firebase_storage: ^12.4.4
  image_picker: ^1.1.2
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter_gen:
  output: lib/app/generated/

  line_length: 120

  integrations:
    image: true
    flutter_svg: true
    lottie: true

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
